openapi: 3.0.0
info:
  title: Universal Search Plugin
  description: Search across Docker logs, source code, PostgreSQL tables, MinIO keys, and Redis keys
  version: 1.0.0
paths:
  /search:
    post:
      summary: Perform a universal search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: Search query text
                sources:
                  type: array
                  items:
                    type: string
                    enum: [docker_logs, source_code, postgres, minio, redis]
                  description: Limit search to specific sources (default all)
                limit:
                  type: integer
                  default: 20
                  description: Max results per source
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        source:
                          type: string
                        title:
                          type: string
                        snippet:
                          type: string
                        metadata:
                          type: object
                  total:
                    type: integer
                  hasMore:
                    type: boolean
  /search/more:
    get:
      summary: Load more results (pagination)
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: source
          in: query
          required: true
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Additional results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                  hasMore:
                    type: boolean
  /search/save:
    post:
      summary: Save a search and its results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - query
              properties:
                name:
                  type: string
                query:
                  type: string
                results:
                  type: array
                  items:
                    type: object
      responses:
        '201':
          description: Search saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
  /search/saved:
    get:
      summary: List saved searches
      responses:
        '200':
          description: Saved searches
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    query:
                      type: string
                    created_at:
                      type: string
  /search/saved/{id}:
    delete:
      summary: Delete a saved search
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Search deleted
